<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>আবেদন সফল</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Roboto, sans-serif; }
        body { background: #fff7ed; min-height: 100vh; display: flex; justify-content: center; align-items: center; }
        .container { 
            width: 100%; 
            max-width: 450px; 
            background: #ffffff; 
            min-height: 100vh; 
            display: flex; 
            flex-direction: column; 
            justify-content: flex-start; 
            align-items: center; 
            padding: 40px 20px 30px; 
            text-align: center; 
            box-shadow: 0 0 25px rgba(255, 106, 0, 0.08); 
        }
        .company-logo {
            width: 80px;
            height: 80px;
            object-fit: cover;
            border-radius: 50%;
            border: 2px solid #fed7aa;
            padding: 3px;
            margin-top: 15px;
            margin-bottom: 25px;
            box-shadow: 0 4px 15px rgba(255, 94, 0, 0.15);
        }
        h2 { font-size: 22px; color: #1e293b; margin-bottom: 12px; font-weight: 700; line-height: 1.4; }
        p { font-size: 14.5px; color: #64748b; line-height: 1.6; margin-bottom: 30px; }
        .icon-box { 
            width: 85px; 
            height: 85px; 
            background: #dcfce7; 
            color: #16a34a; 
            border-radius: 50%; 
            display: flex; 
            align-items: center; 
            justify-content: center; 
            font-size: 40px; 
            margin-bottom: 35px; 
            box-shadow: 0 4px 15px rgba(22, 163, 74, 0.2); 
        }
        .btn-home { 
            width: 100%; 
            padding: 15px; 
            background: linear-gradient(135deg, #ff5e00, #ff8800); 
            color: #ffffff; 
            text-decoration: none; 
            border-radius: 30px; 
            font-weight: bold; 
            font-size: 15px; 
            box-shadow: 0 4px 15px rgba(255, 94, 0, 0.3); 
            display: inline-block; 
            margin-top: auto;
        }
    </style>
</head>
<body>

<div class="container">
    <img src="logoo.png" alt="Company Logo" class="company-logo">
    <h2>আপনার লোন রিকোয়েস্ট টি সফলভাবে জমা হয়েছে</h2>
    <p>অনুগ্রহ করে অপেক্ষা করুন আমরা শীঘ্রই আপনার সাথে যোগাযোগ করব</p>
    <div class="icon-box"><i class="fa-solid fa-check"></i></div>
    <a href="loan.html" class="btn-home">হোমপেজে ফিরে যান</a>
</div>

</body>
</html>
