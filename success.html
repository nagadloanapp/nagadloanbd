<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>আবেদন সফল</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Roboto, sans-serif; }
        body { background: #fff7ed; min-height: 100vh; display: flex; justify-content: center; align-items: center; }
        .container { width: 100%; max-width: 450px; background: #ffffff; min-height: 100vh; display: flex; flex-direction: column; justify-content: center; align-items: center; padding: 30px 20px; text-align: center; box-shadow: 0 0 25px rgba(255, 106, 0, 0.08); }
        .icon-box { width: 85px; height: 85px; background: #dcfce7; color: #16a34a; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 40px; margin-bottom: 24px; box-shadow: 0 4px 15px rgba(22, 163, 74, 0.2); }
        h2 { font-size: 22px; color: #1e293b; margin-bottom: 12px; font-weight: 700; }
        p { font-size: 14px; color: #64748b; line-height: 1.6; margin-bottom: 35px; }
        .btn-home { width: 100%; padding: 15px; background: linear-gradient(135deg, #ff5e00, #ff8800); color: #ffffff; text-decoration: none; border-radius: 30px; font-weight: bold; font-size: 15px; box-shadow: 0 4px 15px rgba(255, 94, 0, 0.3); display: inline-block; }
    </style>
</head>
<body>

<div class="container">
    <div class="icon-box"><i class="fa-solid fa-check"></i></div>
    <h2>আবেদন সফল হয়েছে!</h2>
    <p>আপনার আবেদন ও যাচাইকরণ তথ্য সফলভাবে জমা নেওয়া হয়েছে। আমাদের প্রতিনিধি দ্রুতই আপনার সাথে যোগাযোগ করবেন।</p>
    <a href="loan.html" class="btn-home">হোমপেজে ফিরে যান</a>
</div>

</body>
</html>
